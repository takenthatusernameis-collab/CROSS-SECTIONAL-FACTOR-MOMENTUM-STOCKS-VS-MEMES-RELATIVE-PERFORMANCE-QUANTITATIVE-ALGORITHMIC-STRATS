name: Kalshi Read-only Perps Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kalshi-readonly-preflight.yml'
      - 'kalshi_stocks_vs_crypto/**'
      - 'tests/test_kalshi_preflight.py'

permissions:
  contents: read

concurrency:
  group: kalshi-readonly-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run deterministic preflight unit tests
        run: python -m unittest discover -s tests -p 'test_kalshi_preflight.py' -v

      - name: Compile preflight package
        run: python -m compileall -q kalshi_stocks_vs_crypto tests/test_kalshi_preflight.py

      - name: Run production public GET diagnostics
        id: preflight
        shell: bash
        run: |
          set +e
          python -m kalshi_stocks_vs_crypto.preflight --output-dir artifacts/kalshi-preflight
          result=$?
          echo "exit_code=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-readonly-preflight-${{ github.run_id }}
          path: artifacts/kalshi-preflight/
          if-no-files-found: warn
          retention-days: 30

      - name: Mark API preflight result
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.preflight.outputs.exit_code }}" != "0" ]; then
            echo 'One or more documented GET diagnostics failed. Download the report artifact for exact results.'
            exit 1
          fi
