name: 🟢 $10 PAPER — Bitget Stocks vs Crypto

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Diagnostic only, or run the same monitored/cooldown-gated paper cycle now"
        required: true
        type: choice
        default: paper
        options:
          - diagnostic
          - paper
  push:
    branches: [main]
    paths:
      - ".github/workflows/bitget-stocks-vs-crypto-paper.yml"
      - "bitget_stocks_vs_crypto/**"
      - "scripts/run_bitget_paper.py"
      - "scripts/render_bitget_status.py"
      - "tests/test_bitget_*.py"
      - "README.md"
      - "PROMPT.md"
      - "recovery/restore-bitget-paper-state.json"

# Only one job may read-modify-push the SQLite state branch at a time.
# Do not cancel a running accounting/monitor cycle.
concurrency:
  group: bitget-stocks-vs-crypto-paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bitget-paper:
    name: Five-minute Bitget monitor; rebalance only when 24h lock expires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      PYTHONUNBUFFERED: "1"
      PAPER_INITIAL_NAV_USDT: "10"
      BITGET_TAKER_FEE_RATE: ${{ vars.BITGET_TAKER_FEE_RATE }}
      PAPER_DB: state/bitget_paper.sqlite3
      PAPER_OUTPUT: artifacts/bitget-paper-trading
      MODE: ${{ inputs.mode || 'paper' }}
    steps:
      # Capture the job's actual start before checkout, setup, tests, or APIs.
      # The Python runner uses this fixed timestamp for cooldown and risk windows.
      - name: Capture workflow start timestamp
        shell: bash
        run: echo "PAPER_WORKFLOW_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Bitget tests
        run: python -m unittest discover -s tests -p 'test_bitget_*.py' -v

      - name: Compile source and tests
        run: python -m compileall -q bitget_stocks_vs_crypto scripts tests

      # Fail closed while an earlier paper cycle has not reached durable storage.
      # The recovery push below bypasses this guard; schedules/manual paper cannot.
      - name: Block paper cycles while recovery is pending
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper')
        shell: bash
        run: |
          set -euo pipefail
          STATE_BRANCH="bitget-paper-portfolio-state"
          git fetch --no-tags origin "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"
          if git cat-file -e "refs/remotes/origin/${STATE_BRANCH}:RECOVERY_REQUIRED.md" 2>/dev/null; then
            echo "RECOVERY BLOCKED: the previous $10 portfolio has not yet been restored. No paper runner was started." >&2
            exit 1
          fi

      # Recovery is deliberately a push-triggered, restore-only operation. It
      # retrieves the exact database artifact from the interrupted run and never
      # executes a new market cycle.
      - name: Download exact interrupted paper backup
        if: github.event_name == 'push' && contains(github.event.head_commit.added, 'recovery/restore-bitget-paper-state.json')
        uses: actions/download-artifact@v4
        with:
          name: bitget-stocks-vs-crypto-43546451119
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43546451119
          path: recovered-artifact

      - name: Verify and stage exact recovered paper ledger
        if: github.event_name == 'push' && contains(github.event.head_commit.added, 'recovery/restore-bitget-paper-state.json')
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil, sqlite3
          from decimal import Decimal
          from pathlib import Path

          root = Path("recovered-artifact")
          source_db = root / "state/bitget_paper.sqlite3"
          source_report = root / "artifacts/bitget-paper-trading/bitget_paper_report.json"
          if not source_db.is_file() or not source_report.is_file():
              raise SystemExit("Exact recovery artifact is incomplete: expected SQLite database and original paper report.")
          report = json.loads(source_report.read_text(encoding="utf-8"))
          if report.get("status") != "PAPER_UPDATED" or report.get("paper", {}).get("status") != "UPDATED":
              raise SystemExit("Recovery report does not identify a successful original paper update.")
          if report.get("paper", {}).get("cooldown", {}).get("value") != 1:
              raise SystemExit("Recovery report cooldown does not match the opened portfolio.")
          report_positions = report["paper"]["snapshot"]["open_positions"]
          if {k: v.get("symbol") for k, v in report_positions.items()} != {"LONG": "SOXSUSDT", "SHORT": "BANANAS31USDT"}:
              raise SystemExit("Recovery report open positions do not match the authorized campaign.")

          con = sqlite3.connect(source_db)
          con.row_factory = sqlite3.Row
          try:
              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              if integrity != "ok": raise SystemExit(f"Recovered SQLite integrity failure: {integrity}")
              account = con.execute("SELECT initial_nav,cash FROM account WHERE id=1").fetchone()
              if account is None or Decimal(account["initial_nav"]) != Decimal("10"):
                  raise SystemExit(f"Recovered initial NAV is not 10 USDT: {dict(account) if account else None}")
              positions = {r["leg"]: r["symbol"] for r in con.execute("SELECT leg,symbol FROM positions")}
              if positions != {"LONG": "SOXSUSDT", "SHORT": "BANANAS31USDT"}:
                  raise SystemExit(f"Recovered open positions do not match the original run: {positions}")
              trades = con.execute("SELECT COUNT(*) AS n FROM trades WHERE status='OPEN'").fetchone()["n"]
              if trades != 2: raise SystemExit(f"Expected exactly 2 open trades in recovery DB, found {trades}")
              control = con.execute("SELECT cooldown,activated_at_ms,reset_at_ms FROM cooldown_control WHERE id=1").fetchone()
              if control is None or tuple(control) != (1, 1794623278790, 1794709680000):
                  raise SystemExit(f"Recovered cooldown state does not match run #22: {tuple(control) if control else None}")
              points = con.execute("SELECT COUNT(*) FROM equity_curve").fetchone()[0]
              if points != 2: raise SystemExit(f"Expected START and REBALANCE equity points, found {points}")
              ledger_opens = con.execute("SELECT COUNT(*) FROM ledger WHERE event_type='OPEN'").fetchone()[0]
              if ledger_opens != 2: raise SystemExit(f"Expected two OPEN ledger events, found {ledger_opens}")
          finally:
              con.close()

          db_hash = hashlib.sha256(source_db.read_bytes()).hexdigest()
          Path("state").mkdir(exist_ok=True)
          Path("artifacts/bitget-paper-trading").mkdir(parents=True, exist_ok=True)
          shutil.copy2(source_db, "state/bitget_paper.sqlite3")
          shutil.copy2(source_report, "artifacts/bitget-paper-trading/bitget_paper_report.json")
          print(f"RECOVERY VERIFIED: run=43546451119; initial_nav=10; positions={positions}; open_trades=2; cooldown=1; equity_points=2; sha256={db_hash}")
          PY

      - name: Restore durable SQLite paper ledger
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper')
        shell: bash
        run: |
          set -euo pipefail
          echo "PAPER_RESET_PENDING=false" >> "$GITHUB_ENV"
          mkdir -p state
          STATE_BRANCH="bitget-paper-portfolio-state"
          if git fetch --no-tags origin "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"; then
            if git show "refs/remotes/origin/${STATE_BRANCH}:state/bitget_paper.sqlite3" > "$PAPER_DB" 2>/dev/null; then
              echo "Restored existing durable Bitget paper state."
            elif git cat-file -e "refs/remotes/origin/${STATE_BRANCH}:RESET_PENDING.md" 2>/dev/null; then
              rm -f "$PAPER_DB"
              echo "PAPER_RESET_PENDING=true" >> "$GITHUB_ENV"
              echo "Authorized clean reset detected; bootstrapping a new 10 USDT paper ledger with cooldown=0."
            else
              rm -f "$PAPER_DB"
              echo "ERROR: State database is missing and no authorized reset marker exists; refusing to recreate history." >&2
              exit 1
            fi
            if [[ -s "$PAPER_DB" ]]; then
              python - <<'PY'
          import sqlite3
          con=sqlite3.connect("state/bitget_paper.sqlite3")
          try:
              check=con.execute("PRAGMA integrity_check").fetchone()[0]
              if check != "ok": raise SystemExit(f"SQLite integrity failure: {check}")
              tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              required={"account","trades","positions","ledger","daily_snapshots",
                        "strategy_risk","risk_intervals","minute_metrics","monitor_state",
                        "monitor_minute_metrics","monitor_observations","cooldown_control"}
              missing=required-tables
              if missing: raise SystemExit(f"SQLite state missing tables: {sorted(missing)}")
              print("Restored and integrity-checked the durable Bitget paper/monitor state.")
          finally:
              con.close()
          PY
            fi
          else
            echo "No durable Bitget state branch yet; the first successful scheduled paper run bootstraps the account."
          fi

      - name: Initialize clean 10 USDT portfolio with cooldown set to zero
        if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper')) && env.PAPER_RESET_PENDING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sqlite3
          from decimal import Decimal
          from bitget_stocks_vs_crypto.portfolio import init_db
          from bitget_stocks_vs_crypto.performance import ensure_equity_start

          path = os.environ["PAPER_DB"]
          initial = Decimal(os.environ["PAPER_INITIAL_NAV_USDT"])
          started = int(os.environ["PAPER_WORKFLOW_STARTED_MS"])
          if initial != Decimal("10"):
              raise SystemExit(f"Reset capital must be exactly 10 USDT, got {initial}")
          db = init_db(path, initial)
          try:
              # Explicitly force the newly created reset account into its ready state.
              db.execute("""UPDATE cooldown_control
                            SET cooldown=0, activated_at_ms=NULL, reset_at_ms=NULL,
                                last_reset_run_started_ms=NULL
                            WHERE id=1""")
              if db.execute("SELECT COUNT(*) FROM positions").fetchone()[0] != 0:
                  raise SystemExit("Reset database unexpectedly contains open positions")
              if db.execute("SELECT COUNT(*) FROM trades").fetchone()[0] != 0:
                  raise SystemExit("Reset database unexpectedly contains old trade history")
              account = db.execute("SELECT initial_nav,cash FROM account WHERE id=1").fetchone()
              if Decimal(account[0]) != Decimal("10") or Decimal(account[1]) != Decimal("10"):
                  raise SystemExit(f"Reset account is not 10 USDT: {account}")
              db.commit()
          finally:
              db.close()
          ensure_equity_start(path, started)
          check = sqlite3.connect(path)
          try:
              integrity = check.execute("PRAGMA integrity_check").fetchone()[0]
              state = check.execute("SELECT cooldown,activated_at_ms,reset_at_ms FROM cooldown_control WHERE id=1").fetchone()
              if integrity != "ok": raise SystemExit(f"Reset SQLite integrity check failed: {integrity}")
              if state != (0, None, None): raise SystemExit(f"Cooldown was not reset to 0: {state}")
              if check.execute("SELECT COUNT(*) FROM equity_curve").fetchone()[0] != 1:
                  raise SystemExit("10 USDT equity baseline was not initialized")
              print("RESET READY: initial_nav=10 USDT; cash=10 USDT; cooldown=0; positions=0; trades=0; equity baseline=10 USDT.")
          finally:
              check.close()
          PY

      - name: Run five-minute monitor and cooldown-gated rebalance
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper')
        run: python scripts/run_bitget_paper.py --db-path "$PAPER_DB" --output-dir "$PAPER_OUTPUT" --initial-nav-usdt "$PAPER_INITIAL_NAV_USDT"

      - name: Run read-only ranking diagnostic on pushes/manual diagnostic
        if: (github.event_name == 'push' && !contains(github.event.head_commit.added, 'recovery/restore-bitget-paper-state.json')) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'paper')
        run: python scripts/run_bitget_paper.py --diagnostic-only --db-path "$PAPER_DB" --output-dir "$PAPER_OUTPUT" --initial-nav-usdt "$PAPER_INITIAL_NAV_USDT"

      - name: Check SQLite integrity before persistence
        if: ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper')) || (github.event_name == 'push' && contains(github.event.head_commit.added, 'recovery/restore-bitget-paper-state.json'))) && success()
        run: |
          python - <<'PY'
          import sqlite3
          con=sqlite3.connect("state/bitget_paper.sqlite3")
          try:
              result=con.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok": raise SystemExit(result)
              required={"account","positions","trades","ledger","daily_snapshots",
                        "strategy_risk","risk_intervals","minute_metrics",
                        "monitor_state","monitor_minute_metrics","monitor_observations","equity_curve"}
              tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              missing=required-tables
              if missing: raise SystemExit(f"missing tables: {sorted(missing)}")
              print("SQLite integrity and monitoring schema: OK")
          finally:
              con.close()
          PY

      - name: Persist SQLite portfolio and monitoring state
        if: ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'paper')) || (github.event_name == 'push' && contains(github.event.head_commit.added, 'recovery/restore-bitget-paper-state.json'))) && success()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PAPER_DB"
          DB_COPY="$RUNNER_TEMP/bitget_paper.sqlite3"
          cp "$PAPER_DB" "$DB_COPY"
          # Keep the artifact copy safe even if a later Git branch operation fails.
          trap 'if [[ -s "$DB_COPY" ]]; then mkdir -p "$(dirname "$PAPER_DB")"; cp "$DB_COPY" "$PAPER_DB"; fi' EXIT

          # Render a human-readable view from the exact SQLite copy being persisted.
          python scripts/render_bitget_status.py \
            --db-path "$DB_COPY" \
            --output "$PAPER_OUTPUT/STATUS.md" \
            --workflow-start-ms "$PAPER_WORKFLOW_STARTED_MS" \
            --run-id "$GITHUB_RUN_ID" \
            --event-name "$GITHUB_EVENT_NAME" \
            --mode "$MODE" \
            --repository "$GITHUB_REPOSITORY" \
            --report-json "$PAPER_OUTPUT/bitget_paper_report.json"
          test -s "$PAPER_OUTPUT/STATUS.md"
          for required in equity_curve.svg equity_curve.csv daily_equity.csv trade_history.csv performance_metrics.json; do
            test -s "$PAPER_OUTPUT/$required"
          done

          STATE_BRANCH="bitget-paper-portfolio-state"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The database is untracked on main. Remove that working-tree path before
          # checking out the state branch, where the same path is already tracked.
          rm -f "$PAPER_DB"

          if git fetch --no-tags origin "+refs/heads/${STATE_BRANCH}:refs/remotes/origin/${STATE_BRANCH}"; then
            git checkout -B "$STATE_BRANCH" "refs/remotes/origin/${STATE_BRANCH}"
          else
            git checkout --orphan "$STATE_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p state
          cp "$DB_COPY" state/bitget_paper.sqlite3
          cp "$PAPER_OUTPUT/STATUS.md" STATUS.md
          for required in equity_curve.svg equity_curve.csv daily_equity.csv trade_history.csv performance_metrics.json; do
            cp "$PAPER_OUTPUT/$required" "$required"
          done
          if [[ -f RESET_PENDING.md ]]; then rm RESET_PENDING.md; fi
          if [[ -f RECOVERY_REQUIRED.md ]]; then rm RECOVERY_REQUIRED.md; fi
          git add state/bitget_paper.sqlite3 STATUS.md equity_curve.svg equity_curve.csv daily_equity.csv trade_history.csv performance_metrics.json
          git add -u -- RESET_PENDING.md RECOVERY_REQUIRED.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist lifetime paper performance and readable status"
          fi
          git push origin "HEAD:refs/heads/${STATE_BRANCH}"

      - name: Upload latest reports and restorable database backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitget-stocks-vs-crypto-${{ github.run_id }}
          path: |
            artifacts/bitget-paper-trading/
            state/bitget_paper.sqlite3
          if-no-files-found: warn
          # The long-lived source of truth is the state branch; keep high-frequency
          # per-run artifacts short-lived to avoid hundreds of retained copies.
          retention-days: 1
