name: Kalshi Read-only 24h Ranking Diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: '5 23 15 11 *'

permissions:
  contents: read

concurrency:
  group: kalshi-ranking-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ranking-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard one-time 2026 occurrence
        id: occurrence
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [ "$(date -u +%F)" = "2026-11-15" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "This annual cron is reserved for the 2026 one-time run; skipping later years."
          fi

      - name: Checkout repository
        if: steps.occurrence.outputs.enabled != 'false'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.occurrence.outputs.enabled != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ranking unit tests
        if: steps.occurrence.outputs.enabled != 'false'
        run: python -m unittest discover -s tests -p 'test_kalshi_rankings.py' -v

      - name: Compile Kalshi package
        if: steps.occurrence.outputs.enabled != 'false'
        run: python -m compileall -q kalshi_stocks_vs_crypto tests/test_kalshi_rankings.py

      - name: Run full-universe public GET ranking diagnostic
        id: ranking
        if: steps.occurrence.outputs.enabled != 'false'
        shell: bash
        run: |
          set +e
          python -m kalshi_stocks_vs_crypto.ranking_preflight --output-dir artifacts/kalshi-ranking-preflight --workers 2
          result=$?
          echo "exit_code=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload ranking diagnostic
        if: always() && steps.occurrence.outputs.enabled != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-ranking-preflight-${{ github.run_id }}
          path: artifacts/kalshi-ranking-preflight/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce ranking data-quality gate
        if: always() && steps.occurrence.outputs.enabled != 'false' && steps.ranking.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.ranking.outputs.exit_code }}" != "0" ]; then
            echo 'The ranking diagnostic found incomplete data coverage or a validation blocker. Review the uploaded report.'
            exit 1
          fi
