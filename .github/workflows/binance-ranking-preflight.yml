name: Binance Daily Stock vs Crypto Perp Ranking Diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: '5 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-ranking-preflight.yml'
      - 'binance_stocks_vs_crypto/**'
      - 'tests/test_binance_rankings.py'

permissions:
  contents: read

concurrency:
  group: binance-ranking-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ranking-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run ranking unit tests
        run: python -m unittest discover -s tests -p 'test_binance_rankings.py' -v

      - name: Compile Binance package
        run: python -m compileall -q binance_stocks_vs_crypto tests/test_binance_rankings.py

      - name: Run full-universe public GET ranking diagnostic
        id: ranking
        shell: bash
        run: |
          set +e
          python -m binance_stocks_vs_crypto.ranking_preflight --output-dir artifacts/binance-ranking-preflight --workers 4
          result=$?
          echo "exit_code=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload ranking report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-ranking-preflight-${{ github.run_id }}
          path: artifacts/binance-ranking-preflight/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce ranking data-quality gate
        if: always() && steps.ranking.outcome == 'success'
        shell: bash
        run: |
          if [ "${{ steps.ranking.outputs.exit_code }}" != "0" ]; then
            echo 'The ranking diagnostic found incomplete data coverage or a validation blocker. Review the uploaded report.'
            exit 1
          fi
