name: Binance Read-only Stock vs Crypto Perps Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/binance-readonly-preflight.yml'
      - 'binance_stocks_vs_crypto/**'
      - 'tests/test_binance_preflight.py'
      - 'tests/test_binance_rankings.py'

permissions:
  contents: read

concurrency:
  group: binance-readonly-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run deterministic unit tests
        run: |
          python -m unittest discover -s tests -p 'test_binance_preflight.py' -v
          python -m unittest discover -s tests -p 'test_binance_rankings.py' -v

      - name: Compile Binance package
        run: python -m compileall -q binance_stocks_vs_crypto tests/test_binance_preflight.py tests/test_binance_rankings.py

      - name: Run public GET API preflight
        id: preflight
        shell: bash
        run: |
          set +e
          python -m binance_stocks_vs_crypto.preflight --output-dir artifacts/binance-preflight
          result=$?
          echo "exit_code=${result}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binance-readonly-preflight-${{ github.run_id }}
          path: artifacts/binance-preflight/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce public API preflight gate
        if: always() && steps.preflight.outcome== 'success'
        shell: bash
        run: |
          if [ "${{ steps.preflight.outputs.exit_code }}" != "0" ]; then
            echo 'One or more public Binance market-data checks failed. Review the uploaded artifact.'
            exit 1
          fi
